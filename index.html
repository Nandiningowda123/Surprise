<!DOCTYPE html>
<html>
<head>
  <title>For You ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      font-family: Arial;
      overflow: hidden;
    }

    h1 {
      font-size: 50px;
      color: #fff;
      text-align: center;
      animation: glow 1.5s infinite alternate;
    }

    @keyframes glow {
      0% {
        text-shadow: 0 0 5px #fff,
                     0 0 10px #ff4d6d,
                     0 0 20px #ff4d6d,
                     0 0 40px #ff1a4d;
      }
      100% {
        text-shadow: 0 0 10px #fff,
                     0 0 20px #ff4d6d,
                     0 0 40px #ff1a4d,
                     0 0 80px #ff1a4d;
      }
    }

    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 5s linear infinite;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0);
        opacity: 1;
      }
      to {
        transform: translateY(-100vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

<h1>I need you Chinamma ❤️</h1>

<script>
  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
  }

  setInterval(createHeart, 200);
</script>

</body>
</html>
